name: build-redroid-camera

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout (workflow repo)
        uses: actions/checkout@v4

      - name: Maximize disk space (deep clean)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm || true
          sudo docker image prune -af || true
          sudo mkdir -p /mnt/workspace && sudo chown -R $USER:$USER /mnt/workspace
          sudo rm -rf /usr/local/mysql /usr/local/MySQL /var/lib/mysql /var/lib/postgresql /etc/mysql /usr/lib/mysql || true
          sudo rm -rf /usr/share/miniconda /usr/local/miniconda /opt/conda || true
          sudo rm -rf /usr/local/rubies /usr/lib/ruby /var/lib/gems /usr/local/lib/ruby /home/runner/.rubies || true
          sudo rm -rf /usr/share/swift /usr/local/swift /usr/local/erlang /usr/local/julia /usr/local/elixir /usr/local/php /etc/php || true
          sudo rm -rf /usr/local/llvm /usr/lib/llvm-* || true
          sudo rm -f /usr/local/bin/kubectl /usr/local/bin/kind /usr/local/bin/helm /usr/local/bin/minikube /usr/local/bin/kustomize || true
          sudo rm -rf /opt/google /usr/local/share/chromium /usr/lib/firefox /usr/bin/microsoft-edge || true
          sudo rm -rf /usr/share/java /usr/share/maven /usr/local/maven || true
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          df -h

      - name: Install repo tool + xmllint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          mkdir -p /mnt/workspace/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /mnt/workspace/bin/repo
          chmod a+x /mnt/workspace/bin/repo
          echo "/mnt/workspace/bin" >> $GITHUB_PATH

      - name: Init AOSP 12 tree
        working-directory: /mnt/workspace
        run: |
          git config --global user.email "builder@example.com"
          git config --global user.name "builder"
          repo init -u https://android.googlesource.com/platform/manifest --git-lfs --depth=1 -b android-12.0.0_r34
          mkdir -p .repo/local_manifests
          git clone --depth=1 https://github.com/remote-android/local_manifests.git /tmp/remote-lm -b 12.0.0
          cp /tmp/remote-lm/redroid.xml .repo/local_manifests/
          ls -la .repo/local_manifests/
          test -f .repo/local_manifests/redroid.xml || { echo "FATAL: redroid.xml missing"; exit 1; }

      - name: Repo sync FULL (long)
        working-directory: /mnt/workspace
        run: repo sync -c --no-tags --fail-fast -j8

      - name: Verify device tree exists
        working-directory: /mnt/workspace
        run: |
          ls -la device/redroid/ || { echo "=== diagnostic ==="; repo manifest | grep -i redroid; ls device/; exit 1; }
          test -f device/redroid/redroid.mk || { echo "FATAL: redroid.mk missing"; exit 1; }

      - name: Apply redroid patches (explicit tag)
        working-directory: /mnt/workspace
        run: |
          git clone --depth=1 https://github.com/remote-android/redroid-patches.git /tmp/redroid-patches
          bash /tmp/redroid-patches/apply-patch.sh /mnt/workspace android-12.0.0_r34

      - name: Apply camera HAL patch
        working-directory: /mnt/workspace/device/redroid
        run: |
          ls -la
          git apply --check $GITHUB_WORKSPACE/patches/camera-hal.patch && git apply $GITHUB_WORKSPACE/patches/camera-hal.patch && echo "camera patch applied"

      - name: Switch external camera service to 64-bit (for arm64_only target)
        working-directory: /mnt/workspace
        run: |
          sed -i 's/compile_multilib: "32",/compile_multilib: "first",/' hardware/interfaces/camera/provider/2.4/default/Android.bp
          grep -n "compile_multilib" hardware/interfaces/camera/provider/2.4/default/Android.bp

      - name: Free git metadata disk (not needed for build)
        working-directory: /mnt/workspace
        run: |
          find . -maxdepth 3 -name ".git" -type d ! -path "./.repo/manifests*" -exec rm -rf {} + 2>/dev/null || true
          rm -rf .repo/projects .repo/project-objects 2>/dev/null || true
          du -sh /mnt/workspace
          df -h

      - name: libncurses5 compat (old AOSP clang needs it)
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 /usr/lib/x86_64-linux-gnu/libncursesw.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          ls -la /usr/lib/x86_64-linux-gnu/libncurses.so.5 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Build (m -j4)
        working-directory: /mnt/workspace
        run: |
          source build/envsetup.sh
          lunch redroid_arm64_only-userdebug
          df -h /mnt
          m -j4

      - name: Package raw images (no docker needed)
        working-directory: /mnt/workspace/out/target/product/redroid_arm64
        run: |
          mkdir -p /mnt/workspace/dist
          cp system.img vendor.img vbmeta.img /mnt/workspace/dist/ 2>/dev/null || true
          gzip -k -f /mnt/workspace/dist/system.img /mnt/workspace/dist/vendor.img
          ls -la /mnt/workspace/dist/

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: redroid-camera-arm64
          path: /mnt/workspace/dist/
          retention-days: 7
          compression-level: 0
